# Programme la publication automatique d'un post Instagram depuis la file
# d'attente (content_queue.json), 3 fois par semaine (lun/mer/ven à 9h Paris).
# Entièrement gratuit : GitHub Actions offre des minutes illimitées sur repo public
# (et 2000 min/mois gratuites sur repo privé).

name: Auto-post Instagram

on:
  schedule:
    # Horaires en UTC : 8h UTC = 9h/10h Paris selon heure d'été/hiver
    - cron: "0 8 * * 1,3,5"
  workflow_dispatch: {} # permet de déclencher manuellement depuis l'onglet Actions

permissions:
  contents: write # nécessaire pour commit le statut des posts

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publier le prochain post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python post_to_instagram.py

      - name: Commit la mise à jour de la file (statut publié)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content_queue.json post_log.json 2>/dev/null || git add content_queue.json
          git diff --quiet --cached || git commit -m "chore: mise à jour statut post Instagram [skip ci]"
          git push
