# Génère puis publie automatiquement un Reel Louloutre (Instagram + Facebook)
# mardi, jeudi et samedi à 18h45 heure de Paris (heure d'été ; 17h45 en heure d'hiver).
name: Auto-publication Reels

on:
  schedule:
    - cron: "45 16 * * 2,4,6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Générer sans publier (1 = oui)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install edge-tts pillow imageio-ffmpeg

      - name: Générer et publier le prochain Reel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python reels/publish_reel.py

      - name: Garder la vidéo générée (consultable 7 jours dans l'onglet Actions)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-video
          path: reels/sortie/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Enregistrer le statut
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reels/file_reels.json reels/journal_reels.json 2>/dev/null || true
          git diff --quiet --cached || git commit -m "chore: statut Reel publié [skip ci]"
          git pull --rebase && git push
